<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tra cứu sách | Libra</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">
    <header class="bg-white border-b">
        <div class="max-w-6xl mx-auto p-5"><a href="{{ url_for('profile.dashboard') }}" class="text-sm text-blue-600">←
                Trang độc giả</a>
            <h1 class="text-2xl font-bold mt-1">Khám phá sách</h1>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-5">
        <div class="bg-white border rounded-2xl p-5">
            <form id="catalogueSearch" class="flex gap-2 mb-5"><input id="keyword"
                    placeholder="Tìm theo tên sách, tác giả hoặc mã sách" class="flex-1 border rounded-lg p-3"><button
                    class="bg-blue-600 text-white rounded-lg px-5">Tìm kiếm</button></form>
            <div id="catalogueResults" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{% for book in books %}<article
                    class="border rounded-xl p-4 bg-white">
                    <p class="text-xs text-blue-600 font-semibold">{{ book.book_code }}</p>
                    <h2 class="font-semibold mt-2">{{ book.title }}</h2>
                    <p class="text-sm text-slate-500">{{ book.author }}</p>
                    <p class="text-sm mt-3">Còn {{ book.available_quantity }} bản</p><button
                        data-code="{{ book.book_code }}" class="detailBook mt-3 text-sm text-blue-600">Xem chi
                        tiết</button>
                </article>{% else %}<p class="text-slate-500">Chưa có sách trong danh mục.</p>{% endfor %}</div>
            <p id="catalogueMessage" class="text-sm text-slate-500 mt-4"></p>
        </div>
    </main>
    <dialog id="bookDialog" class="rounded-2xl p-0 w-[min(92vw,520px)] shadow-2xl">
        <div class="p-6">
            <div class="flex justify-between">
                <h2 class="font-bold text-lg">Thông tin sách</h2><button id="closeBookDialog"
                    class="text-slate-500">✕</button>
            </div>
            <div id="bookDetails" class="mt-4 text-sm space-y-2"></div>
        </div>
    </dialog>
    <script src="{{ url_for('static', filename='js/catalogue.js') }}"></script>
</body>

</html>
