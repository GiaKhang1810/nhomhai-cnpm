<!doctype html>
<html lang="vi">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Lập phiếu mượn | Libra</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">
	<header class="bg-white border-b p-5">
		<div class="max-w-4xl mx-auto">
			<a href="{{ url_for('librarian.workspace') }}" class="text-sm text-blue-600">← Bàn làm việc</a>
			<h1 class="text-2xl font-bold mt-1">Lập phiếu mượn</h1>
		</div>
	</header>
	<main class="max-w-4xl mx-auto p-5">
		<form id="borrowForm" class="bg-white border rounded-2xl p-6 space-y-5">
			<label class="block text-sm font-medium">Mã độc giả
				<input id="readerId" name="reader_id" required placeholder="RD-..."
					class="mt-1 w-full border rounded-lg p-3">
			</label>
			<section class="space-y-3">
				<div>
					<h2 class="font-semibold">Chọn đầu sách và bản sao</h2>
					<p class="text-xs text-slate-500 mt-1">Tìm theo tên sách, tác giả hoặc mã sách, sau đó chọn bản sao
						còn khả
						dụng.</p>
				</div>
				<div class="flex flex-col sm:flex-row gap-2">
					<input id="borrowBookSearch" placeholder="Tên sách, tác giả hoặc mã sách"
						class="flex-1 border rounded-lg p-3">
					<button id="searchBorrowBooks" type="button" class="bg-slate-800 text-white rounded-lg px-5">Tìm
						sách</button>
				</div>
				<div id="borrowBookResults" class="space-y-2" aria-live="polite"></div>
				<div id="availableCopyResults" class="border rounded-xl p-4 min-h-12" aria-live="polite"></div>
			</section>
			<section class="border-t pt-4">
				<div class="flex justify-between items-center gap-3 mb-2">
					<h2 class="font-semibold">Bản sao được chọn</h2>
					<span id="selectedCopyCount" class="text-xs text-slate-500">0/5 bản sao đã chọn</span>
				</div>
				<ul id="selectedCopyList" class="space-y-2"></ul>
			</section>
			<p class="text-sm text-slate-500">Thời hạn mượn mặc định: 14 ngày. Mỗi độc giả được mượn tối đa 5 bản sao và
				không
				được có sách quá hạn chưa trả.</p>
			<button type="submit"
				class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-3 font-semibold">Xác nhận
				mượn</button>
			<p id="borrowMessage" class="text-sm mt-2" aria-live="polite"></p>
		</form>
	</main>
	<script src="{{ url_for('static', filename='js/borrow.js') }}"></script>
</body>

</html>
