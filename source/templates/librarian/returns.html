<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ghi nhận trả sách | Libra</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50">
    <header class="bg-white border-b p-5">
        <div class="max-w-4xl mx-auto"><a href="{{ url_for('librarian.workspace') }}" class="text-sm text-blue-600">←
                Bàn làm việc</a>
            <h1 class="text-2xl font-bold mt-1">Ghi nhận trả sách</h1>
        </div>
    </header>
    <main class="max-w-4xl mx-auto p-5 space-y-5">
        <form id="lookupForm" class="bg-white border rounded-2xl p-5 flex flex-col sm:flex-row gap-3"><select
                name="search_type" class="border rounded-lg p-3 bg-white">
                <option value="loan">Theo mã phiếu</option>
                <option value="reader">Theo mã độc giả</option>
            </select><input name="identifier" required value="{{ request.args.get('loan_id', '') }}"
                placeholder="Nhập mã phiếu hoặc mã độc giả" class="flex-1 border rounded-lg p-3"><button
                class="bg-slate-800 text-white rounded-lg px-5">Tra cứu</button></form>
        <div id="loanResults" class="space-y-2"></div>
        <section id="loanPanel" class="hidden bg-white border rounded-2xl p-5">
            <div id="loanInfo" class="mb-4"></div>
            <div id="returnItems" class="space-y-3"></div><button id="submitReturn"
                class="mt-5 bg-blue-600 text-white rounded-lg px-5 py-3 font-semibold">Xác nhận trả các bản sao đã
                chọn</button>
            <p id="returnMessage" class="text-sm mt-3" aria-live="polite"></p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/returns.js') }}"></script>
</body>

</html>
