[project]
name = "libra"
version = "1.0.0"
description = "Library Management System"
authors = [
    {name = "GiaKhang1810",email = "ngkhang9a5lqc11@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "mysql-connector-python (>=26.10.0,<27.0.0)"
]

[tool.poetry]
packages = [
    { include = "source" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
